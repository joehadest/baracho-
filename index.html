    <style>
      /* Faixa latina (cobre o português: ç, ã, õ, é…) */
      @font-face { font-family: "Barlow"; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/barlow-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

      @font-face { font-family: "Barlow"; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/barlow-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Barlow"; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/barlow-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/barlow-condensed-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/barlow-condensed-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

      html, body { background: #0b0b0d; }
      html.scroll-locked { overflow: hidden; }

      /*
       * Abertura em HTML/CSS puro: aparece no primeiro quadro, antes do JavaScript.
       * As entradas usam transform (rodam na GPU), então seguem fluidas mesmo
       * enquanto o navegador monta o resto do site. O React assume a saída.
       */
      @property --pl-pct { syntax: "<integer>"; inherits: false; initial-value: 0; }
      #preloader { position: fixed; inset: 0; z-index: 200; color: #fff; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; animation: pl-failsafe .5s 9s forwards; }
      #preloader .pl-panel { position: absolute; left: 0; right: 0; height: 50%; background: #0b0b0d; }
      #preloader .pl-top { top: 0; }
      #preloader .pl-bottom { bottom: 0; }
      #preloader .pl-redline { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #e31e24; }
      #preloader .pl-center { position: absolute; inset: 0; display: grid; place-items: center; }
      #preloader .pl-stack { display: flex; flex-direction: column; align-items: center; }
      #preloader .pl-clip { overflow: hidden; }
      #preloader .pl-logo { margin: 0; font-size: clamp(3.5rem, 12vw, 9rem); line-height: .95; font-weight: 800; letter-spacing: -.025em; animation: pl-rise .9s cubic-bezier(.16,1,.3,1) .05s both; }
      #preloader .pl-logo span { color: #e31e24; }
      #preloader .pl-tag { margin: 0; font: 400 clamp(.65rem, 1.6vw, .75rem) "JetBrains Mono", ui-monospace, monospace; letter-spacing: .4em; text-transform: uppercase; color: #a1a1aa; animation: pl-rise .9s cubic-bezier(.16,1,.3,1) .15s both; }
      #preloader .pl-foot { position: absolute; left: 0; right: 0; bottom: 2rem; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 1rem; max-width: 88rem; margin: 0 auto; }
      @media (min-width: 640px) { #preloader .pl-foot { padding: 0 1.5rem; } }
      @media (min-width: 1024px) { #preloader .pl-foot { padding: 0 2.5rem; } }
      #preloader .pl-since { margin: 0; font: 400 .75rem "JetBrains Mono", ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; color: #71717a; animation: pl-rise .9s cubic-bezier(.16,1,.3,1) .2s both; }
      #preloader .pl-count { margin: 0; font-size: clamp(3.75rem, 9vw, 6rem); line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; animation: pl-rise .9s cubic-bezier(.16,1,.3,1) .2s both; }
      #preloader .pl-count > span:last-child { color: #e31e24; }
      #preloader .pl-num { counter-reset: pct var(--pl-pct); animation: pl-count 3.2s cubic-bezier(.2,.7,.3,1) .1s both; }
      #preloader .pl-num::before { content: counter(pct, decimal-leading-zero); }
      #preloader .pl-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #e31e24; transform-origin: left; animation: pl-bar 3.2s cubic-bezier(.2,.7,.3,1) .1s both; }
      @keyframes pl-rise { from { transform: translateY(110%); } }
      @keyframes pl-count { from { --pl-pct: 0; } to { --pl-pct: 88; } }
      @keyframes pl-bar { from { transform: scaleX(0); } to { transform: scaleX(.88); } }
      /* Se o JavaScript falhar, a abertura some sozinha */
      @keyframes pl-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #preloader { display: none; } }
    </style>
    <noscript><style>#preloader { display: none; } html.scroll-locked { overflow: auto; }</style></noscript>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <div class="pl-panel pl-top" data-panel="top"></div>
      <div class="pl-panel pl-bottom" data-panel="bottom"></div>
      <div class="pl-redline" data-redline></div>
      <div class="pl-center">
        <div class="pl-stack">
          <div class="pl-clip"><p class="pl-logo" data-logo>BARACHO<span>.</span></p></div>
          <div class="pl-clip"><p class="pl-tag" data-tag>Soluções e Serviços</p></div>
        </div>
      </div>
      <div class="pl-foot">
        <div class="pl-clip"><p class="pl-since" data-meta>Desde 2013</p></div>
        <div class="pl-clip"><p class="pl-count" data-meta><span class="pl-num" data-num></span><span>%</span></p></div>
      </div>
      <div class="pl-bar" data-bar></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
